services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
            fake-pix:
                condition: service_healthy
    fake-pix-db:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_FAKE_PIX_DB_PORT:-5435}:5432'
        environment:
            POSTGRES_DB: fake_pix
            POSTGRES_USER: fake_pix
            POSTGRES_PASSWORD: fake_pix
        volumes:
            - 'sail-fake-pix-pg:/var/lib/postgresql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD-SHELL
                - 'pg_isready -U fake_pix -d fake_pix'
            interval: 5s
            timeout: 3s
            retries: 5
    fake-pix:
        build:
            context: ../fake-pix-provider
            dockerfile: Dockerfile
        image: fake-pix-provider:local
        ports:
            - '${FORWARD_FAKE_PIX_PORT:-8080}:8080'
        environment:
            PORT: 8080
            WEBHOOK_SECRET: '${WEBHOOK_SECRET:-dev-webhook-secret}'
            FAKE_PIX_API_KEY: '${FAKE_PIX_API_KEY:-fake-pix-demo}'
            DATABASE_URL: postgres://fake_pix:fake_pix@fake-pix-db:5432/fake_pix?sslmode=disable
        networks:
            - sail
        depends_on:
            fake-pix-db:
                condition: service_healthy
        healthcheck:
            test:
                - CMD
                - wget
                - '-qO-'
                - 'http://127.0.0.1:8080/health'
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 5s
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    sail-fake-pix-pg:
        driver: local
